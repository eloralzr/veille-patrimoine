name: Collecte PLF / PLFSS 2027

on:
  schedule:
    - cron: "30 4 * * *"        # 06h30 Paris (été) / 05h30 (hiver), après la collecte programmes
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Collecte seule, sans appel LLM"
        type: boolean
        default: false
      textes:
        description: "plf,plfss"
        default: "plf,plfss"

permissions:
  contents: write

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collecte et extraction PLF
        env:
          # Mêmes secrets que collecte.yml (clé LLM, Supabase si utilisé par extraction/llm.py)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          python -m jobs.run_collecte_plf ${{ inputs.dry_run == true && '--dry-run' || '' }} --textes "${{ inputs.textes || 'plf,plfss' }}"
      - name: Commit des exports
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add exports/fiches_plf_*.json exports/refus_plf_*.json exports/.plf_sources_vues.json || true
          git diff --cached --quiet || git commit -m "Export PLF/PLFSS $(date -u +%F)"
          git push
