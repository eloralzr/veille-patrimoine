name: Collecte et extraction quotidiennes

on:
  schedule:
    - cron: "23 4 * * *"    # 06:23 Paris (heure d'été)
    - cron: "23 10 * * *"   # 12:23 Paris, rattrapage si le premier n'a pas tourné
  workflow_dispatch:
    inputs:
      max_docs:
        description: "Nombre maximal de documents à extraire"
        default: "40"
        required: false
      sans_collecte:
        description: "Extraction seule (true/false)"
        default: "false"
        required: false

concurrency:
  group: collecte
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Dépendances
        run: pip install -r requirements-collecte.txt

      - name: Collecte + extraction
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_FOURNISSEUR: ${{ vars.LLM_FOURNISSEUR || 'gemini' }}
          LLM_MODELE: ${{ vars.LLM_MODELE }}
          MAX_DOCS: ${{ inputs.max_docs || '40' }}
        run: |
          ARGS=""
          if [ "${{ inputs.sans_collecte }}" = "true" ]; then ARGS="--sans-collecte"; fi
          python jobs/run_collecte.py $ARGS

      - name: Publier les exports du jour dans le dépôt
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add exports/
          if git diff --cached --quiet; then echo "aucun export à publier"; exit 0; fi
          git commit -m "exports: fiches du $(date -u +%F)"
          git pull --rebase origin main || true
          git push
